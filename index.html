<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch & Earn</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #10141c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #aab2c0;
            margin-bottom: 30px;
        }

        .balance {
            background: #1b2230;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-title {
            color: #aab2c0;
            font-size: 14px;
        }

        .coins {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .watch-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 17px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .watch-btn:disabled {
            opacity: 0.5;
        }

        .info {
            margin-top: 20px;
            color: #8e98a8;
            font-size: 13px;
        }

        #adBox {
            display: none;
            background: #1b2230;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        #timer {
            font-size: 42px;
            font-weight: bold;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">🎁</div>

    <h1>Watch & Earn</h1>

    <div class="subtitle">
        Watch ads and earn points.
    </div>

    <div class="balance">
        <div class="balance-title">Your Balance</div>
        <div class="coins">🪙 <span id="balance">0</span></div>
    </div>

    <div id="adBox">
        <div>📺 Demo Advertisement</div>
        <div id="timer">10</div>
        <div>Complete the demo to receive points.</div>
    </div>

    <button id="watchButton" class="watch-btn" onclick="watchAd()">
        📺 Watch Ad & Earn
    </button>

    <div class="info">
        Demo rewards only.
    </div>

</div>

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        increment
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // Telegram
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBbDUqzhb7IGSy5XyxK24pAUyH1Qfz1hrY",
        authDomain: "watch-and-earn-53fd9.firebaseapp.com",
        projectId: "watch-and-earn-53fd9",
        storageBucket: "watch-and-earn-53fd9.firebasestorage.app",
        messagingSenderId: "50260883530",
        appId: "1:50260883530:web:2f71a261e84e0c8c918eb3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    let balance = 0;

    const telegramUser = tg.initDataUnsafe?.user;

    if (!telegramUser) {
        tg.showAlert("Please open this app from Telegram.");
    }


    const userId = telegramUser
        ? String(telegramUser.id)
        : null;


    // Load balance from Firebase
    async function loadBalance() {

        if (!userId) return;

        try {

            const userRef = doc(db, "users", userId);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {

                balance = userSnap.data().balance || 0;

            } else {

                balance = 0;

                await setDoc(userRef, {
                    balance: 0,
                    telegramId: userId,
                    name: telegramUser.first_name || ""
                });

            }

            document.getElementById("balance").textContent = balance;

        } catch (error) {

            console.error(error);

            tg.showAlert("Could not load balance.");

        }
    }


    // Watch demo ad
    window.watchAd = function () {

        if (!userId) {
            tg.showAlert("Please open the app from Telegram.");
            return;
        }

        const button = document.getElementById("watchButton");
        const adBox = document.getElementById("adBox");
        const timer = document.getElementById("timer");

        button.disabled = true;
        adBox.style.display = "block";

        let seconds = 10;

        timer.textContent = seconds;


        const countdown = setInterval(async () => {

            seconds--;

            timer.textContent = seconds;


            if (seconds <= 0) {

                clearInterval(countdown);

                try {

                    const userRef = doc(db, "users", userId);

                    await updateDoc(userRef, {
                        balance: increment(10)
                    });

                    balance += 10;

                    document.getElementById("balance").textContent = balance;

                    adBox.style.display = "none";

                    button.disabled = false;

                    tg.showAlert("🎉 +10 points added!");

                } catch (error) {

                    console.error(error);

                    adBox.style.display = "none";

                    button.disabled = false;

                    tg.showAlert("Could not save reward.");

                }
            }

        }, 1000);
    };


    // Start
    loadBalance();

</script>

</body>
</html>
