<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch & Earn</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #10141c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #aab2c0;
            margin-bottom: 30px;
        }

        .balance {
            background: #1b2230;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .balance-title {
            color: #aab2c0;
            font-size: 14px;
        }

        .coins {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .watch-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 17px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .watch-btn:disabled {
            opacity: 0.5;
        }

        .info {
            margin-top: 20px;
            color: #8e98a8;
            font-size: 13px;
        }

        #adBox {
            display: none;
            background: #1b2230;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        #timer {
            font-size: 42px;
            font-weight: bold;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">🎁</div>

    <h1>Watch & Earn</h1>

    <div class="subtitle">
        Watch ads and earn points.
    </div>

    <div class="balance">
        <div class="balance-title">Your Balance</div>
        <div class="coins">🪙 <span id="balance">0</span></div>
    </div>

    <div id="adBox">
        <div>📺 Demo Advertisement</div>
        <div id="timer">10</div>
        <div>Complete the demo to receive points.</div>
    </div>

    <button id="watchButton" class="watch-btn" onclick="watchAd()">
        📺 Watch Ad & Earn
    </button>

    <div class="info">
        Demo rewards only.
    </div>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    let balance = 0;

    function watchAd() {

        const button = document.getElementById("watchButton");
        const adBox = document.getElementById("adBox");
        const timer = document.getElementById("timer");

        button.disabled = true;
        adBox.style.display = "block";

        let seconds = 10;
        timer.textContent = seconds;

        const countdown = setInterval(() => {

            seconds--;
            timer.textContent = seconds;

            if (seconds <= 0) {

                clearInterval(countdown);

                balance += 10;

                document.getElementById("balance").textContent = balance;

                adBox.style.display = "none";
                button.disabled = false;

                tg.showAlert("🎉 +10 points added!");

            }

        }, 1000);
    }
</script>

</body>
</html>
